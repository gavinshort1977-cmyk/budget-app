<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'">
  <title>Monthly Budget</title>
  <meta name="description" content="Personal 12-month budget in AED. Works offline; data stays on your device unless you turn on Google Drive sync.">
  <meta name="theme-color" content="#1d5fa8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1>Monthly Budget</h1><span id="whoami" class="who"></span></div>
    <button id="syncPill" class="pill" aria-label="Sync status — open settings">On this device</button>
  </header>
  <div id="banners"></div>
  <main id="view" aria-live="polite"></main>

  <div id="monthbar" class="monthbar">
    <button id="prevMonth" class="icon big" aria-label="Previous month">‹</button>
    <label class="month-pick"><span id="monthLabel">Oct 2026</span><select id="monthSelect" aria-label="Choose month"></select></label>
    <button id="nextMonth" class="icon big" aria-label="Next month">›</button>
  </div>
  <nav class="tabbar" aria-label="Main">
    <button data-view="month"><span aria-hidden="true">✎</span>Month</button>
    <button data-view="summary"><span aria-hidden="true">▤</span>Summary</button>
    <button data-view="accounts"><span aria-hidden="true">◎</span>Accounts</button>
    <button data-view="settings"><span aria-hidden="true">⚙</span>Settings</button>
  </nav>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="dlg"></dialog>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
